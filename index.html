<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f5f4" />
  <meta name="description" content="hin's poker — 手机端优先的德州扑克 PWA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="hin's poker" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>hin's poker · 德州扑克 v7.7</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/style.css?v=v7.7" />
</head>
<body>
  <!-- Lobby: single-screen game home (no scroll) -->
  <div class="lobby" id="lobby">
    <div class="lobby-shell">
      <header class="lobby-brand">
        <div class="hero-badge" aria-hidden="true">H</div>
        <div class="brand-row">
          <h1 class="lobby-title">hin's poker</h1>
          <span class="brand-ver">v7.7</span>
        </div>
      </header>

      <div class="lobby-modes" role="tablist" aria-label="模式">
        <button type="button" class="mode-chip is-on" id="mode-solo" role="tab" aria-selected="true">单机</button>
        <button type="button" class="mode-chip" id="mode-room" role="tab" aria-selected="false">房间</button>
      </div>

      <div class="lobby-main">
        <div class="lobby-controls">
          <label class="lobby-field">
            <span class="field-label">昵称</span>
            <input type="text" id="lobby-name" maxlength="12" placeholder="你的名字" autocomplete="nickname" />
          </label>

          <div class="lobby-field">
            <span class="field-label">头像</span>
            <div class="avatar-picker" id="avatar-picker" role="listbox" aria-label="选择头像"></div>
          </div>

          <label class="lobby-check" id="fill-ai-wrap">
            <input type="checkbox" id="fill-ai" checked />
            <span>空位补 AI</span>
          </label>

          <div class="lobby-field" id="room-code-wrap" hidden>
            <span class="field-label">房间码</span>
            <input type="text" id="lobby-code" maxlength="200" placeholder="房间码或邀请链接" autocomplete="off" spellcheck="false" />
          </div>
        </div>

        <p class="lobby-status" id="lobby-status" hidden></p>
        <p class="lobby-error" id="lobby-error" hidden></p>
        <p class="lobby-hint" id="lobby-hint" hidden></p>

        <div class="lobby-invite" id="lobby-invite" hidden>
          <textarea id="invite-link" readonly rows="2"></textarea>
          <button type="button" class="btn-ghost" id="btn-copy-invite">复制邀请链接</button>
        </div>

        <details class="lobby-adv" id="lobby-adv">
          <summary>服务器</summary>
          <label class="lobby-field">
            <input type="url" id="lobby-ws" placeholder="wss://…" spellcheck="false" autocomplete="off" />
          </label>
        </details>
      </div>

      <footer class="lobby-dock">
        <div class="dock-meta">
          <span class="dock-mode" id="dock-mode">单机</span>
          <span class="dock-sub" id="dock-sub">5 AI</span>
        </div>
        <div class="dock-actions" id="dock-actions">
          <button type="button" class="dock-start" id="btn-solo">开始游戏</button>
          <div class="dock-room" id="dock-room" hidden>
            <button type="button" class="action-btn btn-raise" id="btn-create">创建</button>
            <button type="button" class="action-btn btn-call" id="btn-join">加入</button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <div class="app" id="game-app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div class="brand-text">
          <div class="brand-title">hin's poker <span class="brand-ver" id="brand-ver">v7.7</span></div>
        </div>
      </div>
    </header>

    <div class="game-layout">
      <main class="stage">
        <div class="table-wrap">
          <div class="table-rail">
            <div class="table">
              <div class="felt-pattern"></div>
            </div>
          </div>
          <div class="felt-meta" id="felt-meta" aria-hidden="true">
            <span id="felt-hand">—</span>
            <span class="felt-dot">·</span>
            <span id="felt-blinds">—</span>
          </div>
          <div class="board" id="board" aria-label="公共牌"></div>
          <div class="pot" id="pot">
            <div class="pot-label">底池</div>
            <div class="pot-amount" id="pot-amount">0</div>
            <div class="pot-chips" aria-hidden="true"></div>
          </div>
          <div id="win-banner-slot"></div>

          <!-- 6-max racetrack seats -->
          <div class="seat top-left" data-seat="top-left" id="seat-top-left"></div>
          <div class="seat top-right" data-seat="top-right" id="seat-top-right"></div>
          <div class="seat left" data-seat="left" id="seat-left"></div>
          <div class="seat right" data-seat="right" id="seat-right"></div>
          <div class="seat bottom-left" data-seat="bottom-left" id="seat-bottom-left"></div>
          <div class="seat bottom-right hero-seat" data-seat="bottom-right" id="seat-bottom-right"></div>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="coach-tip" id="coach-tip" hidden></div>
      </main>

      <div class="float-tools" id="float-tools">
        <div class="room-meta">
          <button type="button" class="room-link" id="room-code" hidden>邀请</button>
          <div class="meta-mini">
            <span id="hand-num">—</span>
            <span id="blinds">0.5bb / 1bb</span>
          </div>
        </div>
        <button class="btn-ghost" id="btn-train" type="button" title="训练模式">训练</button>
        <button class="btn-ghost" id="btn-mute" type="button" title="开关音效">🔊</button>
        <button class="btn-ghost" id="btn-rebuy" type="button" hidden>补码</button>
        <button class="btn-ghost" id="btn-reset" type="button">重置</button>
        <button class="btn-ghost" id="btn-leave" type="button">离开</button>
        <details class="hist-details" id="hist-details">
          <summary class="btn-ghost">记录</summary>
          <div class="hist-list" id="hand-history"></div>
        </details>
      </div>

      <footer class="action-bar">
        <div class="action-timer" id="action-timer" hidden>
          <span class="action-timer-num" id="action-timer-num">30</span>
          <div class="action-timer-track"><div class="action-timer-fill" id="action-timer-fill"></div></div>
        </div>
        <div class="quick-raises" id="quick-raises" hidden></div>
        <div class="raise-row" id="raise-row" hidden>
          <input
            type="range"
            id="raise-slider"
            min="0"
            max="2000"
            value="40"
            aria-label="加注金额滑条"
          />
          <label class="raise-amount-wrap" for="raise-amount">
            <input
              type="number"
              id="raise-amount"
              class="raise-amount"
              min="0"
              max="2000"
              value="40"
              inputmode="numeric"
              aria-label="加注金额"
            />
          </label>
        </div>
        <div class="actions" id="actions"></div>
      </footer>
    </div>
  </div>

  <script type="module" src="js/main.js?v=v7.7"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
