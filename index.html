<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <meta name="description" content="hin's poker — 跑道台面德州扑克小游戏，与五位 AI 同桌对战" />
  <title>hin's poker · 德州扑克 v2.0</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css?v=v2.2" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div class="brand-text">
          <div class="brand-title">hin's poker <span class="brand-ver">v2.0</span></div>
          <div class="brand-sub">No-Limit Hold'em</div>
        </div>
      </div>
      <div class="meta">
        <div class="meta-item">
          <span class="meta-label">手牌</span>
          <span class="meta-value" id="hand-num">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">盲注</span>
          <span class="meta-value" id="blinds">10 / 20</span>
        </div>
        <button class="btn-ghost" id="btn-reset" type="button">重置筹码</button>
      </div>
    </header>

    <main class="stage">
      <div class="table-wrap">
        <div class="table-rail">
          <div class="table">
            <div class="felt-pattern"></div>
          </div>
        </div>
        <div class="dealer-well" aria-hidden="true">
          <div class="dealer-figure">
            <img class="dealer-avatar" src="assets/dealer.png" alt="" width="64" height="64" draggable="false" />
            <span class="dealer-label">DEALER</span>
          </div>
        </div>

        <div class="board" id="board" aria-label="公共牌"></div>
        <div class="pot" id="pot">
          <div class="pot-label">底池</div>
          <div class="pot-amount" id="pot-amount">0</div>
          <div class="pot-chips" aria-hidden="true"></div>
        </div>
        <div id="win-banner-slot"></div>

        <!-- 6-max racetrack seats — evenly spaced; hero sits under 林姐 -->
        <div class="seat top-left" data-seat="top-left" id="seat-top-left"></div>
        <div class="seat top-right" data-seat="top-right" id="seat-top-right"></div>
        <div class="seat left" data-seat="left" id="seat-left"></div>
        <div class="seat right" data-seat="right" id="seat-right"></div>
        <div class="seat bottom-left" data-seat="bottom-left" id="seat-bottom-left"></div>
        <div class="seat bottom-right hero-seat" data-seat="bottom-right" id="seat-bottom-right"></div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <footer class="action-bar">
      <div class="raise-row" id="raise-row" hidden>
        <input
          type="range"
          id="raise-slider"
          min="0"
          max="2000"
          value="40"
          aria-label="加注金额滑条"
        />
        <label class="raise-amount-wrap" for="raise-amount">
          <input
            type="number"
            id="raise-amount"
            class="raise-amount"
            min="0"
            max="2000"
            value="40"
            inputmode="numeric"
            aria-label="加注金额"
          />
        </label>
      </div>
      <div class="actions" id="actions"></div>
    </footer>
  </div>

  <script type="module" src="js/main.js?v=v2.2"></script>
</body>
</html>
