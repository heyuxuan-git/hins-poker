<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <meta name="description" content="hin's poker — 跑道台面德州扑克小游戏，与五位 AI 同桌对战" />
  <title>hin's poker · 德州扑克 v4.1</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css?v=v4.1" />
</head>
<body>
  <!-- Lobby -->
  <div class="lobby" id="lobby">
    <div class="lobby-card">
      <div class="brand-mark lobby-mark" aria-hidden="true">H</div>
      <h1 class="lobby-title">hin's poker</h1>
      <p class="lobby-sub">No-Limit Hold'em · 6-max</p>

      <section class="lobby-block">
        <h2>单机</h2>
        <button type="button" class="action-btn btn-start" id="btn-solo">开始练习（5 AI）</button>
      </section>

      <section class="lobby-block">
        <h2>和朋友远程玩</h2>
        <label class="lobby-field">
          <span>昵称</span>
          <input type="text" id="lobby-name" maxlength="12" placeholder="你的名字" autocomplete="nickname" />
        </label>
        <div class="lobby-field">
          <span>头像</span>
          <div class="avatar-picker" id="avatar-picker" role="listbox" aria-label="选择头像"></div>
        </div>
        <label class="lobby-field">
          <span>房间码（加入时填写，可粘贴邀请链接）</span>
          <input type="text" id="lobby-code" maxlength="200" placeholder="6 位房间码 / 邀请链接" autocomplete="off" spellcheck="false" />
        </label>
        <div class="lobby-row">
          <button type="button" class="action-btn btn-raise" id="btn-create">创建房间</button>
          <button type="button" class="action-btn btn-call" id="btn-join">加入房间</button>
        </div>
        <p class="lobby-status" id="lobby-status" hidden></p>
        <p class="lobby-hint" id="lobby-hint">空位自动补 AI。远程请用<strong>邀请链接</strong>加入最省事。</p>
        <p class="lobby-error" id="lobby-error" hidden></p>
        <details class="lobby-adv" id="lobby-adv">
          <summary>高级：联机服务器地址</summary>
          <label class="lobby-field">
            <span>所有人必须相同（邀请链接会自动带上）</span>
            <input type="url" id="lobby-ws" placeholder="wss://…" spellcheck="false" autocomplete="off" />
          </label>
          <p class="lobby-hint">本机开发可用 <code>ws://127.0.0.1:8787</code>；远程请填公网地址或直接分享邀请链接。</p>
        </details>
        <div class="lobby-invite" id="lobby-invite" hidden>
          <div class="lobby-invite-label">发给朋友这条链接</div>
          <textarea id="invite-link" readonly rows="3"></textarea>
          <button type="button" class="btn-ghost" id="btn-copy-invite">复制邀请链接</button>
        </div>
      </section>
    </div>
  </div>

  <div class="app" id="game-app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div class="brand-text">
          <div class="brand-title">hin's poker <span class="brand-ver" id="brand-ver">v4.1</span></div>
          <div class="brand-sub" id="brand-sub">No-Limit Hold'em</div>
        </div>
      </div>
      <div class="meta">
        <div class="meta-item" id="room-badge" hidden>
          <span class="meta-label">房间（点我复制邀请）</span>
          <button type="button" class="meta-value room-link" id="room-code">—</button>
        </div>
        <div class="meta-item">
          <span class="meta-label">手牌</span>
          <span class="meta-value" id="hand-num">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">盲注</span>
          <span class="meta-value" id="blinds">0.5bb / 1bb</span>
        </div>
        <button class="btn-ghost" id="btn-mute" type="button" title="开关音效">🔊</button>
        <button class="btn-ghost" id="btn-rebuy" type="button" hidden>补码</button>
        <button class="btn-ghost" id="btn-reset" type="button">重置筹码</button>
        <button class="btn-ghost" id="btn-leave" type="button">离开</button>
      </div>
    </header>

    <main class="stage">
      <div class="table-wrap">
        <div class="table-rail">
          <div class="table">
            <div class="felt-pattern"></div>
          </div>
        </div>
        <div class="dealer-well" aria-hidden="true">
          <div class="dealer-figure">
            <img class="dealer-avatar" src="assets/dealer.png" alt="" width="64" height="64" draggable="false" />
            <span class="dealer-label">DEALER</span>
          </div>
        </div>

        <div class="board" id="board" aria-label="公共牌"></div>
        <div class="pot" id="pot">
          <div class="pot-label">底池</div>
          <div class="pot-amount" id="pot-amount">0</div>
          <div class="pot-chips" aria-hidden="true"></div>
        </div>
        <div id="win-banner-slot"></div>

        <!-- 6-max racetrack seats — evenly spaced; hero sits under 林姐 -->
        <div class="seat top-left" data-seat="top-left" id="seat-top-left"></div>
        <div class="seat top-right" data-seat="top-right" id="seat-top-right"></div>
        <div class="seat left" data-seat="left" id="seat-left"></div>
        <div class="seat right" data-seat="right" id="seat-right"></div>
        <div class="seat bottom-left" data-seat="bottom-left" id="seat-bottom-left"></div>
        <div class="seat bottom-right hero-seat" data-seat="bottom-right" id="seat-bottom-right"></div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <footer class="action-bar">
      <div class="action-timer" id="action-timer" hidden>
        <span class="action-timer-label">行动倒计时</span>
        <span class="action-timer-num" id="action-timer-num">30</span>
        <div class="action-timer-track"><div class="action-timer-fill" id="action-timer-fill"></div></div>
      </div>
      <div class="quick-raises" id="quick-raises" hidden></div>
      <div class="raise-row" id="raise-row" hidden>
        <input
          type="range"
          id="raise-slider"
          min="0"
          max="2000"
          value="40"
          aria-label="加注金额滑条"
        />
        <label class="raise-amount-wrap" for="raise-amount">
          <input
            type="number"
            id="raise-amount"
            class="raise-amount"
            min="0"
            max="2000"
            value="40"
            inputmode="numeric"
            aria-label="加注金额"
          />
        </label>
      </div>
      <div class="actions" id="actions"></div>
    </footer>
  </div>

  <script type="module" src="js/main.js?v=v4.1"></script>
</body>
</html>
